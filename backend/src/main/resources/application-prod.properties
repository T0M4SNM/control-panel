# Perfil de producción: se activa con SPRING_PROFILES_ACTIVE=prod (ver deploy/panel/compose.yaml).

# Detrás de dos proxies (Caddy compartido con HTTPS → Caddy de la web → backend): se fía de sus
# cabeceras X-Forwarded-*, que solo pueden venir de la red interna de Docker
server.forward-headers-strategy=native

# La cookie de sesión solo viaja por HTTPS
server.servlet.session.cookie.secure=true

# Si el contenedor se para, termina las peticiones en curso antes de salir
server.shutdown=graceful
