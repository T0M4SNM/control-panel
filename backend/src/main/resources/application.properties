spring.application.name=control-panel-backend

# Flyway es el dueño del esquema; Hibernate solo comprueba que las entidades encajan con él
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errores de la API en formato estándar RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true

# Cookie de sesión: no accesible desde JavaScript y no se envía desde otros sitios
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# Primer administrador (ver .env.example). Solo se usa si no hay ningún usuario.
app.bootstrap.workspace-name=${APP_BOOTSTRAP_WORKSPACE_NAME:}
app.bootstrap.admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${APP_BOOTSTRAP_ADMIN_NAME:}
