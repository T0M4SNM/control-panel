name: Imágenes Docker

# Construye las imágenes del backend y del frontend y las publica en GitHub Container Registry
# (ghcr.io) con dos etiquetas: «latest» y el hash del commit. El servidor solo las descarga.
# Se ejecuta con cada cambio en main que toque código; también a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Imagen ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/t0m4snm/control-panel-${{ matrix.name }}:latest
            ghcr.io/t0m4snm/control-panel-${{ matrix.name }}:${{ github.sha }}
          # Caché de capas entre ejecuciones: si solo cambia el código, no se reinstalan dependencias
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
